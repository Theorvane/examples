name: Release promotion

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-promotion:
    name: release-promotion
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the promotion source
        run: test "${{ github.head_ref }}" = "dev"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
